<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Calendar / Event Top Bar -->
  <rect x="96" y="112" width="320" height="288" rx="32" fill="#FFFFFF" fill-opacity="0.95"/>
  <rect x="96" y="112" width="320" height="72" rx="32" fill="#4338CA"/>
  <rect x="96" y="152" width="320" height="32" fill="#4338CA"/>
  
  <!-- Calendar Binder Rings -->
  <rect x="156" y="80" width="24" height="64" rx="12" fill="#F8FAFC"/>
  <rect x="332" y="80" width="24" height="64" rx="12" fill="#F8FAFC"/>

  <!-- Variance Comparison Graphic inside Calendar -->
  <!-- Expected Budget Bar (Neutral) -->
  <rect x="136" y="220" width="240" height="20" rx="10" fill="#E2E8F0"/>
  <rect x="136" y="220" width="160" height="20" rx="10" fill="#818CF8"/>

  <!-- Actual Spending Bar (Green / Under-Budget Indicator) -->
  <rect x="136" y="260" width="240" height="20" rx="10" fill="#E2E8F0"/>
  <rect x="136" y="260" width="125" height="20" rx="10" fill="url(#accent)"/>

  <!-- Currency / Delta Badge -->
  <circle cx="256" cy="334" r="32" fill="#4F46E5"/>
  <text x="256" y="347" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle">$</text>
  
  <!-- Trend Indicator Arrow -->
  <path d="M340 320 L365 345 M365 320 L365 345 L340 345" stroke="#10B981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
